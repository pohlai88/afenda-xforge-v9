name: AFENDA

# The Definition of Done gate (afenda/SPEC.md §7): lint the AFENDA layer, then
# install it on a fresh database and run its tests against this repository's
# own Odoo tree.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for psycopg2 and python-ldap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev libldap2-dev libsasl2-dev
      - name: Python requirements
        run: pip install -r requirements.txt rl-renderPM ruff
      - name: Lint
        run: ruff check afenda/addons
      - name: Install afenda_brand and run its tests
        run: |
          python odoo-bin -c afenda/odoo.conf \
            --db_host localhost --db_port 5432 --db_user odoo --db_password odoo \
            -d ci -i afenda_brand --test-tags /afenda_brand \
            --stop-after-init --log-level=info 2>&1 | tee odoo.log
          if grep -E " (ERROR|CRITICAL) " odoo.log; then exit 1; fi
          grep -qE "tests.result: 0 failed, 0 error\(s\)" odoo.log
