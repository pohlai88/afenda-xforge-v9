# AFENDA checks on every push to the product branch and every pull request
# into it: the fast tools suite (no database, no Docker) on Python 3.11 and
# 3.12, and `nginx -t` on both deploy configs.
# The Odoo module suites need PostgreSQL and the built image; they run in
# afenda-image.yml.
name: afenda-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afenda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    # 3.11 is what development and the image run today; 3.12 is the target
    # (the platform spec's "Python 3.12 / ubuntu:noble"). Both stay until 3.12
    # has held green; the 3.11 job keeps its original check name.
    name: tools suite${{ matrix.python != '3.11' && format(' (Python {0})', matrix.python) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the tools' pinned requirements
        run: |
          python -m pip install -r afenda/tools/requirements.txt
          if [ -f afenda/tools/requirements-icons.txt ]; then
            python -m pip install -r afenda/tools/requirements-icons.txt
          fi
      - name: python -m unittest discover afenda/tools/tests
        # unittest exits non-zero on any failure or import error; the count
        # guard catches a discovery that silently found almost nothing.
        run: |
          set -o pipefail
          python -m unittest discover afenda/tools/tests 2>&1 | tee unittest.log
          ran=$(sed -n 's/^Ran \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' unittest.log)
          echo "tests ran: ${ran:-0}"
          if [ "${ran:-0}" -lt 100 ]; then
            echo "::error::only ${ran:-0} tests ran; discovery lost test modules"
            exit 1
          fi

  api_contract:
    # No database, no Docker: api_diff reads the committed openapi/ documents
    # and the base ref's git objects only, so this runs on every pull request
    # regardless of what afenda-image.yml's path filters would build, and on
    # every push to main too (the owner's path into main may be a direct
    # push, not a PR merge, and that must be gated just the same).
    name: api contract
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch main as the base contract
        # A depth-1 checkout has no history to diff against, and api_diff
        # needs a local ref to read the base documents from. A pull request
        # diffs against main's current tip; a push (below) diffs against the
        # commit main pointed at before the push instead.
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: python -m afenda.tools.api_diff check --base-ref origin/main
        # api_diff is standard-library only, so no install step precedes
        # this. Since 172c12518, what it prints depends on whether the base
        # ref has a contract: a real version-to-version diff prints the
        # three change lists (breaking, additive, descriptive) in full; with
        # no base contract (e.g. this PR introduces the asset, or the base
        # ref predates it), every item in HEAD is additive by construction,
        # so it prints the three change-class counts instead. Either way,
        # keep the output in the PR's Summary tab even when the check
        # fails, so a breaking change is visible without opening logs.
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          # Raw text in $GITHUB_STEP_SUMMARY is rendered as Markdown and its
          # blank lines collapse; a fenced block keeps the three change
          # lists readable, and the fence still closes when the check fails.
          # GitHub's default shell for `run:` is already `bash -eo pipefail`,
          # so a bare `status=$?` on the line after the pipe never runs on
          # failure: errexit terminates the shell at the failing pipeline
          # itself. `|| status=$?` keeps the pipeline inside a checked
          # command, so errexit does not fire, and the fence still closes.
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          status=0
          python -m afenda.tools.api_diff check --base-ref origin/main 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: python -m afenda.tools.api_diff check --base-ref <pre-push commit>
        # A push's base is the commit main pointed at before the push
        # (github.event.before), fetched by SHA since it need not be main's
        # current tip once other commits have landed since. A brand-new
        # branch's first push reports `before` as all zeros -- there is no
        # prior commit to diff against, so this prints a notice and succeeds
        # trivially instead of fetching a SHA that never existed. Values come
        # through `env:`, never interpolated into the script, so a crafted
        # `before` cannot inject shell syntax.
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::github.event.before is all zeros (new branch); nothing to diff api_diff against"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE"
          # Same fenced-summary / `|| status=$?` pattern as the pull_request
          # step above, and for the same reason: GitHub's default `run:`
          # shell is `bash -eo pipefail`, so a bare `status=$?` after the
          # piped check never runs on failure, and the fence must still close.
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          status=0
          python -m afenda.tools.api_diff check --base-ref "$BEFORE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  nginx:
    name: nginx -t
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: deploy
      - name: nginx -t on afenda.conf and afenda.tls.conf
        # The upstream host `xforge` and the certificate exist only on the
        # VPS; a hosts entry and a throwaway self-signed pair stand in.
        run: |
          d=$(mktemp -d)
          mkdir -p "$d/live/app.nexuscanon.com"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=app.nexuscanon.com \
            -keyout "$d/live/app.nexuscanon.com/privkey.pem" \
            -out "$d/live/app.nexuscanon.com/fullchain.pem"
          for conf in afenda.conf afenda.tls.conf; do
            echo "== $conf"
            docker run --rm --add-host xforge:127.0.0.1 \
              -v "$PWD/deploy/nginx/$conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$d:/etc/letsencrypt:ro" \
              nginx:1.27-alpine nginx -t
          done
