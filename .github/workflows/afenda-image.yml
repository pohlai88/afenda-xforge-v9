# Build the deploy image when something that goes into it changes, check that
# it carries the product identity, and run the AFENDA Odoo module suites inside
# it. About ten minutes per run, so it is limited to these paths; a change
# elsewhere is still built on the VPS by deploy/redeploy.sh, which puts the
# previous commit back if the build fails. Pull requests into main run it too,
# so the module suites gate a change before it merges, not after.
name: afenda-image

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "afenda/**"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/afenda-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/**"
      - "afenda/**"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/afenda-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afenda-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ODOO_TESTS_MIN: "87"  # d90f5aa6f, CI printed 87: afenda_api_docs 16, afenda_brand 55, afenda_brand_digest 2, afenda_runtime 14 (86 at 8336f0737, 72 at 943d1d4a4)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      - name: docker build -f deploy/Dockerfile .
        run: docker build -f deploy/Dockerfile -t afenda/xforge:ci .
      - name: The image is AFENDA xForge
        run: |
          name=$(docker run --rm --entrypoint /opt/venv/bin/python afenda/xforge:ci \
            -c "import sys; sys.path.insert(0, '/opt/afenda'); import odoo.release as r; print(r.product_name)")
          echo "product_name: $name"
          test "$name" = "AFENDA xForge"
      - name: A least-privilege role, as on the VPS
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_admin \
            postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6 \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_admin -d postgres \
            -c "CREATE ROLE afenda_app LOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'ci'"
      - name: Odoo module suites (afenda_*), as afenda_app
        run: |
          set -o pipefail
          mods=afenda_brand,afenda_runtime,afenda_api_docs,afenda_brand_digest
          # afenda_brand's tests import afenda.tools.app_icons, and the image
          # does not ship afenda/tools (deploy/Dockerfile copies afenda/addons
          # and afenda/oca only). So this container, and only this one, gets
          # the checked-out tools mounted read-only and their pinned
          # requirements installed into /tmp/pydeps; the production image is
          # unchanged.
          # requirements.txt, not requirements-icons.txt: the tests import the
          # brand-image chain app_icons -> brand_images -> xforge_icons, which
          # needs Pillow and fontTools. requirements-icons.txt (resvg-py,
          # pyclipper) would only be needed if a test imported
          # afenda.tools.xforge_icons_v3.
          # Pillow is filtered out: PYTHONPATH precedes the venv's
          # site-packages, and Odoo must keep loading the image's own Pillow.
          docker run --rm --network host \
            -v "$PWD/afenda/tools:/opt/afenda/afenda/tools:ro" \
            -e MODS="$mods" \
            --entrypoint sh afenda/xforge:ci -c '
              grep -viE "^pillow[=<>~!; ]" /opt/afenda/afenda/tools/requirements.txt > /tmp/tools-requirements.txt &&
              /opt/venv/bin/pip install -q --no-cache-dir --disable-pip-version-check \
                --target /tmp/pydeps -r /tmp/tools-requirements.txt &&
              export PYTHONPATH=/tmp/pydeps &&
              exec /opt/venv/bin/python /opt/afenda/odoo-bin \
                --db_host 127.0.0.1 --db_port 5432 --db_user afenda_app --db_password ci -d ci \
                --addons-path /opt/afenda/addons,/opt/afenda/afenda/addons,/opt/afenda/afenda/oca/server-brand,/opt/afenda/afenda/oca/web \
                --data-dir /tmp/afenda-data -i "$MODS" \
                --test-enable --test-tags "/afenda_brand,/afenda_runtime,/afenda_api_docs,/afenda_brand_digest" \
                --stop-after-init --http-port 8069 --workers 0 \
                --log-level warn --log-handler odoo.tests:INFO' 2>&1 | tee odoo-tests.log
          line=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' odoo-tests.log | tail -n 1 || true)
          echo "result: ${line:-none}"
          set -- $(printf '%s' "$line" | grep -oE '[0-9]+')
          [ "$#" -eq 3 ] || { echo "::error::no Odoo test result line"; exit 1; }
          [ "$1" -eq 0 ] && [ "$2" -eq 0 ] || { echo "::error::$line"; exit 1; }
          [ "$3" -ge "$ODOO_TESTS_MIN" ] || { echo "::error::only $3 tests ran (min $ODOO_TESTS_MIN)"; exit 1; }
