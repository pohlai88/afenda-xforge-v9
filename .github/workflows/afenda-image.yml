# Build the deploy image when something that goes into it changes, and check
# that it carries the product identity. About ten minutes per run, so it is
# limited to these paths; a change elsewhere is still built on the VPS by
# deploy/redeploy.sh, which puts the previous commit back if the build fails.
name: afenda-image

on:
  push:
    branches: [afenda/deidentify-phase1]
    paths:
      - "deploy/**"
      - "afenda/**"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/afenda-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afenda-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      - name: docker build -f deploy/Dockerfile .
        run: docker build -f deploy/Dockerfile -t afenda/xforge:ci .
      - name: The image is AFENDA xForge
        run: |
          name=$(docker run --rm --entrypoint /opt/venv/bin/python afenda/xforge:ci \
            -c "import sys; sys.path.insert(0, '/opt/afenda'); import odoo.release as r; print(r.product_name)")
          echo "product_name: $name"
          test "$name" = "AFENDA xForge"
