# Build the deploy image when something that goes into it changes, check that
# it carries the product identity, run the AFENDA Odoo module suites inside
# it, and regenerate the OpenAPI asset to gate it against the committed one.
# Up to an hour per run (the asset step alone can take 20 minutes), so it is
# limited to the image's inputs: every COPY source in deploy/Dockerfile,
# .dockerignore and this file. A change elsewhere is still built on the VPS
# by deploy/redeploy.sh, which puts the previous commit back if the build
# fails. Pull requests into main run it too, so the module suites and the
# asset check gate a change before it merges, not after.
name: afenda-image

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "afenda/**"
      - "odoo/**"
      - "addons/**"
      - "odoo-bin"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/afenda-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/**"
      - "afenda/**"
      - "odoo/**"
      - "addons/**"
      - "odoo-bin"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/afenda-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afenda-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PACK_TESTS_MIN: "17"  # industry packs: afenda_industry_base 4, afenda_industry_bakery 13 (local, fresh database, fac7cbd6e)
      ODOO_TESTS_MIN: "183"  # measured by the Task 7 fresh-database simulation (afenda_t7, e5b3b81a5): "0 failed, 0 error(s) of 183 tests when loading database 'afenda_t7'" for afenda_brand,afenda_brand_digest,afenda_runtime,afenda_api_docs together
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true
      - name: docker build -f deploy/Dockerfile .
        run: docker build -f deploy/Dockerfile -t afenda/xforge:ci .
      - name: The image is AFENDA xForge
        run: |
          name=$(docker run --rm --entrypoint /opt/venv/bin/python afenda/xforge:ci \
            -c "import sys; sys.path.insert(0, '/opt/afenda'); import odoo.release as r; print(r.product_name)")
          echo "product_name: $name"
          test "$name" = "AFENDA xForge"
      - name: A least-privilege role, as on the VPS
        run: |
          docker run --rm --network host -e PGPASSWORD=ci_admin \
            postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6 \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U ci_admin -d postgres \
            -c "CREATE ROLE afenda_app LOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'ci'"
      - name: A data directory the runs below share
        # Each `docker run --rm` starts from a fresh container, and the ci
        # database's attachments live in the filestore: a later run without
        # the same data directory fails on every attachment-backed field.
        run: install -d -m 777 "$RUNNER_TEMP/afenda-data"
      - name: Odoo module suites (afenda_*), as afenda_app
        run: |
          set -o pipefail
          mods=afenda_brand,afenda_runtime,afenda_api_docs,afenda_brand_digest
          # afenda_brand's tests import afenda.tools.app_icons, and the image
          # does not ship afenda/tools (deploy/Dockerfile copies afenda/addons
          # and afenda/oca only). So this container, and only this one, gets
          # the checked-out tools mounted read-only and their pinned
          # requirements installed into /tmp/pydeps; the production image is
          # unchanged.
          # requirements.txt, not requirements-icons.txt: the tests import the
          # brand-image chain app_icons -> brand_images -> xforge_icons, which
          # needs Pillow and fontTools. requirements-icons.txt (resvg-py,
          # pyclipper) would only be needed if a test imported
          # afenda.tools.xforge_icons_v3.
          # Pillow is filtered out: PYTHONPATH precedes the venv's
          # site-packages, and Odoo must keep loading the image's own Pillow.
          docker run --rm --network host \
            -v "$PWD/afenda/tools:/opt/afenda/afenda/tools:ro" \
            -v "$RUNNER_TEMP/afenda-data:/ci-data" \
            -e MODS="$mods" \
            --entrypoint sh afenda/xforge:ci -c '
              grep -viE "^pillow[=<>~!; ]" /opt/afenda/afenda/tools/requirements.txt > /tmp/tools-requirements.txt &&
              /opt/venv/bin/pip install -q --no-cache-dir --disable-pip-version-check \
                --target /tmp/pydeps -r /tmp/tools-requirements.txt &&
              export PYTHONPATH=/tmp/pydeps &&
              exec /opt/venv/bin/python /opt/afenda/odoo-bin \
                --db_host 127.0.0.1 --db_port 5432 --db_user afenda_app --db_password ci -d ci \
                --addons-path /opt/afenda/addons,/opt/afenda/afenda/addons,/opt/afenda/afenda/oca/server-brand,/opt/afenda/afenda/oca/web \
                --data-dir /ci-data -i "$MODS" \
                --test-enable --test-tags "/afenda_brand,/afenda_runtime,/afenda_api_docs,/afenda_brand_digest" \
                --stop-after-init --http-port 8069 --workers 0 \
                --log-level warn --log-handler odoo.tests:INFO' 2>&1 | tee odoo-tests.log
          line=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' odoo-tests.log | tail -n 1 || true)
          echo "result: ${line:-none}"
          set -- $(printf '%s' "$line" | grep -oE '[0-9]+')
          [ "$#" -eq 3 ] || { echo "::error::no Odoo test result line"; exit 1; }
          [ "$1" -eq 0 ] && [ "$2" -eq 0 ] || { echo "::error::$line"; exit 1; }
          [ "$3" -ge "$ODOO_TESTS_MIN" ] || { echo "::error::only $3 tests ran (min $ODOO_TESTS_MIN)"; exit 1; }
      - name: Industry pack suites, as afenda_app
        # The packs refuse to install before a chart of accounts exists
        # (afenda_industry_bakery/hooks.py, _check_accounting_is_set_up), and
        # the chart only loads once its install run finishes, so account goes
        # in first, without tests, on the same database and filestore.
        run: |
          set -o pipefail
          odoo() {
            docker run --rm --network host -v "$RUNNER_TEMP/afenda-data:/ci-data" \
              --entrypoint /opt/venv/bin/python afenda/xforge:ci /opt/afenda/odoo-bin \
              --db_host 127.0.0.1 --db_port 5432 --db_user afenda_app --db_password ci -d ci \
              --addons-path /opt/afenda/addons,/opt/afenda/afenda/addons,/opt/afenda/afenda/oca/server-brand,/opt/afenda/afenda/oca/web \
              --data-dir /ci-data --stop-after-init --http-port 8069 --workers 0 \
              --log-level warn --log-handler odoo.tests:INFO "$@"
          }
          odoo -i account
          odoo -i afenda_industry_base,afenda_industry_bakery \
            --test-enable --test-tags "/afenda_industry_base,/afenda_industry_bakery" 2>&1 | tee pack-tests.log
          line=$(grep -oE '[0-9]+ failed, [0-9]+ error\(s\) of [0-9]+ tests' pack-tests.log | tail -n 1 || true)
          echo "result: ${line:-none}"
          set -- $(printf '%s' "$line" | grep -oE '[0-9]+')
          [ "$#" -eq 3 ] || { echo "::error::no industry pack test result line"; exit 1; }
          [ "$1" -eq 0 ] && [ "$2" -eq 0 ] || { echo "::error::$line"; exit 1; }
          [ "$3" -ge "$PACK_TESTS_MIN" ] || { echo "::error::only $3 tests ran (min $PACK_TESTS_MIN)"; exit 1; }
      - name: API asset is current
        # A fresh database, `assets`, not the `ci` one above: the exporter
        # refuses a database whose installed applications differ from
        # asset_rules.manifest_applications, and `ci` also carries the
        # industry packs installed without every other application.
        timeout-minutes: 20
        run: |
          set -o pipefail
          APPS=$(python3 -c "import sys; sys.path.insert(0, 'afenda/addons/afenda_api_docs'); from asset_rules import manifest_applications; import pathlib; print(','.join(manifest_applications(pathlib.Path('addons'))))")
          MODS="afenda_brand,afenda_runtime,afenda_api_docs,$APPS"
          docker run --rm --network host -v "$RUNNER_TEMP/afenda-data:/ci-data" \
            --entrypoint /opt/venv/bin/python afenda/xforge:ci /opt/afenda/odoo-bin \
            --db_host 127.0.0.1 --db_port 5432 --db_user afenda_app --db_password ci -d assets \
            --addons-path /opt/afenda/addons,/opt/afenda/afenda/addons,/opt/afenda/afenda/oca/server-brand,/opt/afenda/afenda/oca/web \
            --data-dir /ci-data -i "$MODS" --without-demo=all --stop-after-init --http-port 8069 --workers 0 \
            --log-level warn --log-handler odoo.tests:INFO
          # The container writes as `afenda` (deploy/Dockerfile:86); the
          # runner's checkout is owned by the actions user, so the mounted
          # directory must be opened up before the exporter can write into it.
          chmod -R a+w afenda/addons/afenda_api_docs/openapi
          # The committed baseline, read from git BEFORE the export mutates
          # the working directory below: `ls` afterwards would just measure
          # what the exporter itself wrote, which passes the count check
          # even when the exporter is broken.
          committed=$(git ls-files -- 'afenda/addons/afenda_api_docs/openapi/*.json' | wc -l)
          # `-i` is mandatory: without it stdin is empty and the export is a
          # silent no-op.
          docker run -i --rm --network host \
            -v "$PWD/afenda/addons/afenda_api_docs/openapi:/out" \
            -v "$RUNNER_TEMP/afenda-data:/ci-data" \
            -e OUT_DIR=/out -e ADDONS_ROOT=/opt/afenda/addons \
            --entrypoint /opt/venv/bin/python afenda/xforge:ci /opt/afenda/odoo-bin shell \
            --db_host 127.0.0.1 --db_port 5432 --db_user afenda_app --db_password ci -d assets \
            --data-dir /ci-data --no-http < afenda/tools/export_openapi_shell.py 2>&1 | tee export.log
          line=$(grep -oE 'afenda-openapi: wrote [0-9]+ documents' export.log | tail -n 1 || true)
          echo "result: ${line:-none}"
          n=$(printf '%s' "$line" | grep -oE '[0-9]+' || true)
          [ -n "$n" ] || { echo "::error::no afenda-openapi result line"; exit 1; }
          [ "$n" -gt 0 ] || { echo "::error::exporter wrote 0 documents"; exit 1; }
          [ "$n" -eq "$committed" ] || { echo "::error::exporter wrote $n documents, $committed *.json files are committed"; exit 1; }
          if [ -n "$(git status --porcelain -- afenda/addons/afenda_api_docs/openapi)" ]; then
            echo "::error::the API asset is stale: download the \`openapi-asset\` artifact, or run the exporter (afenda/README.md), and commit"
            exit 1
          fi
      - name: Upload the regenerated API asset
        # Runs even when the step above failed the staleness check, so a
        # stale run still offers the regenerated files for download.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-asset
          path: afenda/addons/afenda_api_docs/openapi
