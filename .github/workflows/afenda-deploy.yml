# Deploy main to the live host once CI has passed on it.
#
# Runs when afenda-ci or afenda-image finishes on a push to main, and
# deploys only when, for that exact commit, both have succeeded and it is
# still the head of main. The workflow that finishes second does the
# deploy; the first one sees the other still running and stops. A commit
# that did not touch the image's inputs (afenda-image never ran) changes
# nothing the host builds, so it is not deployed.
#
# The host side is deploy/ci-redeploy.sh, the deploy key's forced command:
# this workflow can only hand it a commit id. Setup, secrets and rollback:
# deploy/README.md, "Automatic deploys". Until the secrets exist, every run
# ends with a notice and no failure.
name: afenda-deploy

on:
  workflow_run:
    workflows: [afenda-ci, afenda-image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit id to deploy (default: the head of main)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: afenda-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to the live host
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Decide
        id: decide
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          go() { echo "deploy=$1" >> "$GITHUB_OUTPUT"; echo "sha=${sha:-}" >> "$GITHUB_OUTPUT"; }
          if [ "$HAS_KEY" != true ]; then
            echo "::notice::Automatic deploys are not set up yet (no DEPLOY_SSH_KEY secret); see deploy/README.md, Automatic deploys."
            go false; exit 0
          fi
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sha=${INPUT_SHA:-$head}
            [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit id: $sha"; exit 1; }
            echo "Manual deploy of $sha"
            go true; exit 0
          fi
          sha=$RUN_SHA
          if [ "$sha" != "$head" ]; then
            echo "::notice::$sha is no longer the head of main ($head); the newer commit deploys itself."
            go false; exit 0
          fi
          # Newest run of each workflow for this commit, pushes only.
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=push&per_page=50" \
            --jq '[.workflow_runs[] | select(.name == "afenda-ci" or .name == "afenda-image")]
                  | group_by(.name) | map(max_by(.run_number)) | map({(.name): (.status + "/" + (.conclusion // ""))}) | add // {}')
          echo "CI for $sha: $runs"
          ci=$(jq -r '."afenda-ci" // "absent"' <<<"$runs")
          image=$(jq -r '."afenda-image" // "absent"' <<<"$runs")
          if [ "$image" = absent ]; then
            echo "::notice::afenda-image did not run for $sha: nothing the host builds changed."
            go false; exit 0
          fi
          if [ "$ci" != completed/success ] || [ "$image" != completed/success ]; then
            echo "Not both green yet (afenda-ci $ci, afenda-image $image); the later one decides."
            go false; exit 0
          fi
          go true

      - name: Redeploy the host at this commit
        if: steps.decide.outputs.deploy == 'true'
        env:
          SHA: ${{ steps.decide.outputs.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          install -m 600 /dev/null "$d/key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$d/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$d/known_hosts"
          # The host's forced command ignores everything but this commit id.
          ssh -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$d/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$SHA"
          echo "::notice::Deployed $SHA to $DEPLOY_HOST"
