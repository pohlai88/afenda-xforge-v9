# AFENDA xForge behind nginx with TLS (VPS). Used through compose.tls.yaml.
# TLS terminates here and only here: the server runs with proxy_mode, which
# trusts exactly one X-Forwarded-* hop, so no other proxy may sit in front.
#
# Three names, one certificate: app.nexuscanon.com is the server,
# nexuscanon.com the landing page (deploy/site), www.nexuscanon.com a redirect
# to it. The certificate's lineage is app.nexuscanon.com and covers all three.
# Replace the names below if the domain differs. Certificates come from
# certbot on the host (webroot /var/www/certbot), see README.md.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream xforge {
    server xforge:8069;
}

upstream xforge_websocket {
    server xforge:8072;
}

server {
    listen 80;
    server_name app.nexuscanon.com nexuscanon.com www.nexuscanon.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.nexuscanon.com;

    ssl_certificate     /etc/letsencrypt/live/app.nexuscanon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nexuscanon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The server sets session_id with httponly only (odoo/http.py); mark every
    # cookie Secure here. TLS conf only: the plain-HTTP stack would lose its
    # session over http://localhost:8080.
    proxy_cookie_flags ~ secure;

    client_max_body_size 128m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # The database manager stays closed (list_db = False on the server too).
    location ~ ^/web/database {
        return 404;
    }

    location /websocket {
        proxy_pass http://xforge_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://xforge;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}

# The landing page. 40-afenda-site.sh copies deploy/site here and writes
# PUBLIC_URL into it. A location with its own add_header drops every
# server-level add_header, so those locations repeat HSTS and the security
# headers. The CSP's style-src hash is the page's one inline <style> element;
# afenda/tools/tests/test_deploy_static.py fails when they drift apart.
server {
    listen 443 ssl;
    http2 on;
    server_name nexuscanon.com;

    ssl_certificate     /etc/letsencrypt/live/app.nexuscanon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nexuscanon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    root /usr/share/nginx/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # `/` reaches this through `index`, so the page gets it either way.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=300";
    }

    location /fonts/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types image/svg+xml;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.nexuscanon.com;

    ssl_certificate     /etc/letsencrypt/live/app.nexuscanon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nexuscanon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://nexuscanon.com$request_uri;
}
