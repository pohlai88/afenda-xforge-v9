# AFENDA xForge behind nginx, plain HTTP (local and the independence proof).
# nginx is the one proxy hop: the server runs with proxy_mode, which trusts
# exactly one X-Forwarded-* hop. Put nothing else in front without TLS here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream xforge {
    server xforge:8069;
}

upstream xforge_websocket {
    server xforge:8072;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 128m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # $http_host keeps the port (localhost:8080) that $host drops, so
    # redirects and URLs the server builds point where the browser is.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # The database manager stays closed (list_db = False on the server too).
    location ~ ^/web/database {
        return 404;
    }

    location /websocket {
        proxy_pass http://xforge_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://xforge;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
