# VPS variant: nginx terminates TLS with a certbot certificate.
# Select it with COMPOSE_FILE=compose.yaml:compose.tls.yaml in deploy/.env
# (see README.md). Certificates are issued on the host by certbot, webroot
# mode, into the two host directories mounted below. The volume list is an
# !override, so it repeats the landing page mounts from compose.yaml; the
# ports !override leaves 8081 unpublished, the page is served on 443.
services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./nginx/afenda.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/usr/share/nginx/site-src:ro
      - ./nginx/40-afenda-site.sh:/docker-entrypoint.d/40-afenda-site.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
