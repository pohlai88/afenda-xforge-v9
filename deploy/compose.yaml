# AFENDA xForge stack: PostgreSQL, a one-shot init, the server, and nginx.
#
#   ./make-secrets.sh                    # once; needs the image, see README.md
#   docker compose up -d                 # from this directory
#
# nginx is the only service with a published port. Secrets are files under
# ./secrets (gitignored), mounted at /run/secrets/<name>.
#
# The project name prefixes every container, volume and network. Not plain
# `afenda`: an unrelated Compose project of that name can exist on the same
# host, and `down --remove-orphans` / `down -v` would reach into it.
name: afenda-deploy

x-xforge-image: &xforge-image
  image: ${XFORGE_IMAGE:-afenda/xforge:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile

# Bounded container logs on every service (at most 5 x 10 MB each).
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-xforge-env: &xforge-env
  PGHOST: db
  PGUSER: xforge
  PGPASSWORD_FILE: /run/secrets/db_password
  ADMIN_PASSWD_HASH_FILE: /run/secrets/master_password_hash

services:
  db:
    image: postgres:16
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: xforge
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first init the image's temporary server
      # listens on the Unix socket only, and would report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U xforge -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  init:
    <<: *xforge-image
    logging: *logging
    command: ["/usr/local/bin/afenda-init"]
    restart: "no"
    environment:
      <<: *xforge-env
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    secrets:
      - db_password
      - master_password_hash
      - admin_password
    volumes:
      # The same data_dir as xforge: attachments written while modules
      # install land in the filestore the server will read.
      - xforge-data:/var/lib/afenda
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  xforge:
    <<: *xforge-image
    logging: *logging
    restart: unless-stopped
    environment:
      <<: *xforge-env
    secrets:
      - db_password
      - master_password_hash
    volumes:
      - xforge-data:/var/lib/afenda
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    logging: *logging
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/afenda.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      xforge:
        condition: service_healthy
    networks:
      - backend
      - frontend

networks:
  backend: {}
  frontend: {}

volumes:
  db-data: {}
  xforge-data: {}

secrets:
  db_password:
    file: ./secrets/db_password
  master_password_hash:
    file: ./secrets/master_password_hash
  admin_password:
    file: ./secrets/admin_password
