<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFENDA xForge</title>
<meta name="description" content="The truth of your business, kept.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F7F5">
<style>
  @font-face { font-family: "Source Serif 4"; src: url("fonts/SourceSerif4-Semibold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Source Sans 3"; src: url("fonts/SourceSans3.woff2") format("woff2"); font-weight: 200 900; font-display: swap; }

  :root { color-scheme: light; --paper: #F7F7F5; --ink: #0F172A; --quiet: #4B5563; --ledger: #1E3A8A; --ledger-hover: #172E6E; --on-ledger: #FFFFFF; }

  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 400 17px/1.5 "Source Sans 3", system-ui, sans-serif;
    display: grid; place-items: center; min-height: 100svh; padding: 24px; box-sizing: border-box; text-align: center;
  }
  main { display: grid; justify-items: center; gap: 40px; }
  .lockup { width: 172px; height: auto; display: block; }
  h1 { margin: 0; font: 600 clamp(34px, 6vw, 60px)/1.1 "Source Serif 4", Georgia, serif; letter-spacing: -0.015em; max-width: 14ch; }
  nav { display: grid; justify-items: center; gap: 18px; }
  .request { display: inline-block; padding: 15px 30px; border-radius: 10px; background: var(--ledger); color: var(--on-ledger); font-weight: 600; font-size: 17px; text-decoration: none; }
  .request:hover { background: var(--ledger-hover); }
  .signin { color: var(--quiet); font-size: 15px; text-decoration: none; }
  .signin:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  a:focus-visible { outline: 3px solid var(--ledger); outline-offset: 4px; border-radius: 10px; }
</style>
</head>
<body>
  <main>
    <img class="lockup" src="lockup.svg" alt="AFENDA xForge" width="172" height="68">
    <h1>The truth of your business, kept.</h1>
    <nav aria-label="Account">
      <a class="request" href="__PUBLIC_URL__/request-access">Request access</a>
      <a class="signin" href="__PUBLIC_URL__/web/login">Sign in</a>
    </nav>
  </main>
</body>
</html>
