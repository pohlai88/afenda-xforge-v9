; AFENDA xForge — local development configuration.
; Run from the repository root:
;   .venv/Scripts/python odoo-bin -c afenda/odoo.conf
[options]
addons_path = addons,afenda/addons,afenda/oca/server-brand,afenda/oca/web
db_host = 127.0.0.1
db_port = 5444
db_user = odoo
http_interface = 127.0.0.1
http_port = 8169
workers = 0
max_cron_threads = 0
list_db = True
log_level = warn
; `log_level = warn` above silences the INFO line that reports the test result, so a
; PASSING suite prints nothing at all and `exit = 0` cannot be told apart from "no tests
; were collected" -- a green exit code that means nothing. `log_handler` is applied after
; `log_level` (odoo/netsvc.py:319, last entry per logger wins), so this restores the count
; and the per-addon stats while leaving the rest of the output quiet. `odoo.tests.result`
; and `odoo.tests.stats` inherit it, having no level of their own.
log_handler = odoo.tests:INFO
