; AFENDA xForge — local development configuration.
; Run from the repository root:
;   .venv/bin/python odoo-bin -c afenda/odoo.conf
; list_db and the missing admin_passwd are for development only: never expose
; this file's settings on a server. See afenda/README.md, "Production on a VPS".
[options]
addons_path = addons,afenda/addons,afenda/oca/server-brand,afenda/oca/web,afenda/oca/server-tools
server_wide_modules = base,web,module_change_auto_install
db_host = 127.0.0.1
db_port = 5444
db_user = odoo
http_interface = 127.0.0.1
http_port = 8169
workers = 0
max_cron_threads = 1
list_db = True
log_level = warn
; Belt and braces: disable_odoo_online already neutralizes the weekly report.
publisher_warranty_url = http://127.0.0.1:9/

; OCA module_change_auto_install: never auto-install the Odoo S.A. IAP apps.
; A module that hard-depends on one (point_of_sale needs partner_autocomplete)
; still pulls it in; the blocked endpoints in afenda_brand cover that case.
[module_change_auto_install]
modules_disabled = partner_autocomplete,snailmail,snailmail_account,crm_iap_enrich,crm_iap_mine
